<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login | Gymnast</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap + Template CSS -->
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<!-- Login Start -->
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card bg-secondary text-white p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
        <div class="text-center mb-4">
            <h1 class="display-4 font-weight-bold text-primary">Gymnast</h1>
            <p class="text-white-50">Login to your account</p>
        </div>

        <form>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">
                Login
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-white-50">Forgot password?</a><br>
            <a href="#" class="text-primary font-weight-bold">Create an account</a>
        </div>
    </div>
</div>
<!-- Login End -->

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
