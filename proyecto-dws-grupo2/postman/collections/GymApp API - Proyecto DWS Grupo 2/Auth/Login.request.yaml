$kind: http-request
description: "Inicia sesión. El servidor devuelve dos cookies HttpOnly: 'AuthToken' (5 min) y 'RefreshToken' (7 días). Postman las guarda automáticamente para las siguientes peticiones."
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "user@gym.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.test('Login exitoso', function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData.status).to.eql('SUCCESS');
          });
          console.log('✅ Login OK. Cookies AuthToken y RefreshToken guardadas automáticamente.');
      }
    language: text/javascript
order: 1000
