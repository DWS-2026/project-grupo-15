$kind: http-request
url: https://localhost:8443/api/v1/reviews/
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "about": "Clase de yoga",
      "rating": 5,
      "comment": "Excelente clase, muy recomendada",
      "userId": 1,
      "classEntityId": 1
    }
order: 2000
