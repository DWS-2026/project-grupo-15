$kind: http-request
name: Login
url: '{{base_url}}/api/{{api_version}}/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "paco@gmail.com",
      "password": "1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.token) {
        pm.environment.set("token", json.token);
      }
order: 2000