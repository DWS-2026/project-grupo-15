openapi: 3.1.0
info:
  title: TitanGym API
  description: Documentación oficial de la API REST del gimnasio TitanGym
  version: "1.0"
servers:
- url: https://localhost:8443
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Servicios
  description: Gestión del catálogo de servicios y suplementos del gimnasio
- name: Clases
  description: Gestión de las clases y actividades del gimnasio
- name: Usuarios
  description: Gestión de los miembros y perfiles del gimnasio
- name: Reseñas
  description: Gestión de valoraciones y comentarios de los usuarios
- name: Imágenes
  description: "Gestión de subida y descarga de imágenes del sistema (Usuarios, Clases\
    \ y Servicios)"
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Obtener usuario por ID
      description: Busca la información de un miembro específico mediante su identificador.
      operationId: getUserById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No existe ningún usuario con ese ID
          content: {}
        "200":
          description: Usuario encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
    put:
      tags:
      - Usuarios
      summary: Actualizar un usuario
      description: "Modifica los datos de un miembro existente. Si se envía una contraseñ\
        a, será encriptada."
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequestDTO"
        required: true
      responses:
        "404":
          description: Usuario no encontrado
          content: {}
        "200":
          description: Usuario actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "400":
          description: Datos de actualización inválidos
    delete:
      tags:
      - Usuarios
      summary: Eliminar un usuario
      description: Borra permanentemente la cuenta de un miembro.
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Usuario no encontrado
          content: {}
        "200":
          description: Usuario eliminado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
  /api/v1/services/{id}:
    get:
      tags:
      - Servicios
      summary: Obtener un servicio por su ID
      description: Busca la información detallada de un servicio específico.
      operationId: getService
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No existe ningún servicio con ese ID
          content: {}
        "200":
          description: Servicio encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceResponseDTO"
    put:
      tags:
      - Servicios
      summary: Actualizar un servicio
      description: Modifica los datos de un servicio ya existente en el sistema.
      operationId: updateService
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestDTO"
        required: true
      responses:
        "404":
          description: Servicio no encontrado para actualizar
          content: {}
        "200":
          description: Servicio actualizado correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceResponseDTO"
        "400":
          description: Datos de actualización inválidos
    delete:
      tags:
      - Servicios
      summary: Eliminar un servicio
      description: Borra permanentemente un servicio del catálogo.
      operationId: deleteService
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Servicio no encontrado para eliminar
          content: {}
        "200":
          description: Servicio eliminado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceResponseDTO"
  /api/v1/reviews/{id}:
    get:
      tags:
      - Reseñas
      summary: Obtener reseña por ID
      description: Busca una valoración específica por su identificador único.
      operationId: getReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No existe ninguna reseña con ese ID
          content: {}
        "200":
          description: Reseña encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
    put:
      tags:
      - Reseñas
      summary: Actualizar una reseña
      description: Modifica el contenido o la nota de una reseña existente.
      operationId: replaceReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestDTO"
        required: true
      responses:
        "404":
          description: Reseña no encontrada
          content: {}
        "200":
          description: Reseña actualizada correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
    delete:
      tags:
      - Reseñas
      summary: Eliminar una reseña
      description: Borra permanentemente un comentario. Requiere permisos de administrador
        o del autor.
      operationId: deleteReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Reseña no encontrada
          content: {}
        "200":
          description: Reseña eliminada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
  /api/v1/classes/{id}:
    get:
      tags:
      - Clases
      summary: Obtener una clase por su ID
      description: Busca una clase específica utilizando su identificador único.
      operationId: getClassById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No existe ninguna clase con ese ID
          content: {}
        "200":
          description: Clase encontrada exitosamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
    put:
      tags:
      - Clases
      summary: Actualizar una clase existente
      description: Modifica los datos completos de una clase ya registrada.
      operationId: updateClass
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassRequestDTO"
        required: true
      responses:
        "404":
          description: Clase no encontrada para actualizar
          content: {}
        "200":
          description: Clase actualizada correctamente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
        "400":
          description: Datos de actualización inválidos
    delete:
      tags:
      - Clases
      summary: Eliminar una clase
      description: Borra permanentemente una clase del sistema.
      operationId: deleteClass
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Clase no encontrada para eliminar
          content: {}
        "200":
          description: Clase eliminada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
  /api/v1/users/{userId}/image:
    post:
      tags:
      - Imágenes
      summary: Subir foto de perfil de usuario
      description: Sube una imagen y la asocia como foto de perfil de un usuario existente.
      operationId: uploadProfileImage
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "404":
          description: Usuario no encontrado
          content: {}
        "201":
          description: Imagen subida y asociada con éxito
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: El archivo enviado está vacío o es inválido
  /api/v1/users/:
    post:
      tags:
      - Usuarios
      summary: Registrar un nuevo usuario
      description: Crea una nueva cuenta de usuario en el sistema.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
        "201":
          description: Usuario creado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "400":
          description: Datos de registro inválidos
  /api/v1/services/{serviceId}/image:
    post:
      tags:
      - Imágenes
      summary: Subir imagen de un servicio
      description: Sube una imagen representativa para un servicio o suplemento.
      operationId: uploadServiceImage
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "404":
          description: Servicio no encontrado
          content: {}
        "201":
          description: Imagen subida y asociada con éxito
          content:
            '*/*':
              schema:
                type: object
  /api/v1/services/:
    get:
      tags:
      - Servicios
      summary: Obtener todos los servicios
      description: "Devuelve una página con los servicios disponibles (Fisioterapia,\
        \ Nutrición, Bebidas, etc.)."
      operationId: getServices
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Catálogo de servicios recuperado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelServiceResponseDTO"
    post:
      tags:
      - Servicios
      summary: Crear un nuevo servicio
      description: Añade un nuevo servicio al catálogo general.
      operationId: createService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
        "201":
          description: Servicio creado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceResponseDTO"
        "400":
          description: Los datos del servicio son incorrectos
  /api/v1/reviews/:
    get:
      tags:
      - Reseñas
      summary: Obtener todas las reseñas
      description: Devuelve una página con todas las valoraciones de los clientes.
      operationId: getReviews
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Lista de reseñas recuperada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelReviewResponseDTO"
    post:
      tags:
      - Reseñas
      summary: Publicar una nueva reseña
      description: Crea un comentario y una puntuación asociada a una clase y un usuario.
      operationId: createReview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
        "201":
          description: Reseña publicada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponseDTO"
        "400":
          description: Datos de la reseña inválidos
  /api/v1/classes:
    get:
      tags:
      - Clases
      summary: Obtener todas las clases
      description: Devuelve una página con todas las clases o actividades disponibles
        en el gimnasio.
      operationId: getAllClasses
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Lista de clases recuperada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelClassResponseDTO"
    post:
      tags:
      - Clases
      summary: Crear una nueva clase
      description: Añade una nueva clase o actividad al catálogo del gimnasio.
      operationId: createClass
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
        "201":
          description: Clase creada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
        "400":
          description: Los datos proporcionados para la clase son inválidos
  /api/v1/classes/{classId}/image:
    post:
      tags:
      - Imágenes
      summary: Subir imagen de una clase
      description: Sube una imagen representativa para una clase o actividad del gimnasio.
      operationId: uploadClassImage
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
              required:
              - imageFile
      responses:
        "404":
          description: Clase no encontrada
          content: {}
        "201":
          description: Imagen subida y asociada con éxito
          content:
            '*/*':
              schema:
                type: object
  /api/auth/logout:
    post:
      tags:
      - auth-rest-controller
      operationId: logout
      responses:
        "404":
          description: Not Found
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/auth/login:
    post:
      tags:
      - auth-rest-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "404":
          description: Not Found
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/v1/users:
    get:
      tags:
      - Usuarios
      summary: Obtener todos los usuarios
      description: Devuelve una página con la lista de todos los miembros registrados.
        Requiere permisos de administrador.
      operationId: getAllUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Lista de usuarios recuperada con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelUserResponseDTO"
  /api/v1/users/me:
    get:
      tags:
      - Usuarios
      summary: Obtener mi perfil
      description: Devuelve los datos del usuario que ha iniciado sesión actualmente.
      operationId: getMe
      responses:
        "404":
          description: Not Found
        "200":
          description: Perfil recuperado con éxito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "401":
          description: No autorizado / No hay sesión activa
  /api/v1/images/{id}/media:
    get:
      tags:
      - Imágenes
      summary: Descargar una imagen
      description: Descarga los datos binarios de una imagen a partir de su ID.
      operationId: downloadImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Imagen no encontrada
          content: {}
        "200":
          description: Imagen descargada con éxito
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/classes/{id}/reviews:
    get:
      tags:
      - Clases
      summary: Obtener reseñas de una clase
      description: Recupera todas las valoraciones y comentarios asociados a una clase
        concreta.
      operationId: getClassReviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Clase no encontrada
          content: {}
        "200":
          description: Lista de reseñas recuperada con éxito
          content:
            '*/*':
              schema:
                type: object
  /api/v1/classes/{id}/attendees:
    get:
      tags:
      - Clases
      summary: Obtener asistentes de una clase
      description: Recupera la lista de todos los usuarios inscritos en una clase
        específica.
      operationId: getClassAttendees
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Clase no encontrada
          content: {}
        "200":
          description: Lista de asistentes recuperada con éxito
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    UserRequestDTO:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
    ImageResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        profileImage:
          $ref: "#/components/schemas/ImageResponseDTO"
    ServiceRequestDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        serviceKey:
          type: string
    ServiceResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        serviceKey:
          type: string
        enrolled:
          type: boolean
        image:
          $ref: "#/components/schemas/ImageResponseDTO"
    ReviewRequestDTO:
      type: object
      properties:
        about:
          type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
        userId:
          type: integer
          format: int64
        classEntityId:
          type: integer
          format: int64
    ReviewResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        about:
          type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
        user:
          $ref: "#/components/schemas/UserResponseDTO"
    ClassRequestDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        schedule:
          type: string
    ClassResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        schedule:
          type: string
        image:
          $ref: "#/components/schemas/ImageResponseDTO"
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        username:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelUserResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponseDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelServiceResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ServiceResponseDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelReviewResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ReviewResponseDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelClassResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ClassResponseDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
