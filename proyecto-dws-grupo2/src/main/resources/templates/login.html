<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Login | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card bg-secondary text-white p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
        <div class="text-center mb-4">
            <a href="/" class="navbar-brand">
                <h1 class="display-4 font-weight-bold text-primary">TITANGYM</h1>
            </a>
            <p class="text-white-50">Entra con tu cuenta</p>
        </div>

        <!-- Mensaje de error -->
        {{#error}}
        <div class="alert alert-danger text-center" role="alert">
            {{error}}
        </div>
        {{/error}}

        <form action="/login" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Introduce tu email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password"
                       class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Introduce tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">
                Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/recuperar-contrasena" class="text-white-50">¿No recuerdas tu contraseña?</a><br>
            <a href="/register" class="text-primary font-weight-bold">Registrarse</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
