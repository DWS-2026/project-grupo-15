<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Editar Perfil | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container-fluid">
        <div class="row">

            {{> partials/sidebar}}

            <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h1 class="display-4 font-weight-bold">Editar Perfil</h1>
                    <span class="text-white-50">Modifica tus datos personales</span>
                </div>

                <div class="card bg-secondary text-white p-5">

                    <h3 class="mb-4 text-primary">Información Personal</h3>

                    <form action="/profile/edit" method="post" enctype="multipart/form-data">

                        <div class="text-center mb-4">
                            {{#user.profileImageUrl}}
                            <img src="/profile/image/{{user.id}}" class="rounded-circle mb-3" width="150" height="150" alt="Foto de perfil">
                            {{/user.profileImageUrl}}
                            {{^user.profileImageUrl}}
                            <img src="/img/avatar.jpg" class="rounded-circle mb-3" width="150" height="150" alt="Foto por defecto">
                            {{/user.profileImageUrl}}

                            <div class="mt-3">
                                <label class="form-label">Cambiar foto</label>
                                <input type="file" name="profilePicture" class="form-control bg-dark text-white border-0" accept="image/*">
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label>Nombre</label>
                            <input type="text" name="firstName" class="form-control bg-dark text-white border-0" value="{{user.firstName}}">
                        </div>

                        <div class="form-group mb-3">
                            <label>Apellidos</label>
                            <input type="text" name="lastName" class="form-control bg-dark text-white border-0" value="{{user.lastName}}">
                        </div>

                        <div class="form-group mb-3">
                            <label>Correo electrónico</label>
                            <input type="email" name="email" class="form-control bg-dark text-white border-0" value="{{user.email}}">
                        </div>

                        <div class="form-group mb-3">
                            <label>Nueva contraseña</label>
                            <input type="password" name="password" class="form-control bg-dark text-white border-0" placeholder="Dejar en blanco para no cambiar">
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary mr-3">
                                <i class="fas fa-save mr-2"></i> Guardar cambios
                            </button>

                            <a href="/profile" class="btn btn-light">
                                <i class="fas fa-arrow-left mr-2"></i> Volver al perfil
                            </a>
                        </div>

                    </form>
                    <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                </div>

            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>

</html>
