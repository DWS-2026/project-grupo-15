<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Mi Perfil | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div class="container-fluid">
        <div class="row">
            {{> partials/sidebar}}
            
            <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h1 class="display-4 font-weight-bold">Mi Perfil</h1>
                    <span class="text-white-50">Bienvenido, {{user.firstName}}</span>
                </div>

                <div class="card bg-secondary text-white p-5 text-center">
                    <img src="{{user.profileImageUrl}}" 
                         class="rounded-circle mb-3 border border-primary" 
                         width="150" height="150" 
                         style="object-fit: cover;" 
                         onerror="this.src='/img/avatar.jpg'" 
                         alt="Foto de perfil">

                    <h2 class="font-weight-bold">{{user.firstName}} {{user.lastName}}</h2>
                    <p class="text-white-50">{{user.email}}</p>

                    <hr class="border-light my-4">

                   <div class="text-left">
            <h3 class="mb-4 text-primary">Editar Información Personal</h3>
            
            <form action="/profile/edit" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="_csrf" value="{{token}}">
                
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="firstName" class="text-white">Nombre</label>
                        <input type="text" class="form-control" id="firstName" name="firstName" value="{{user.firstName}}" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="lastName" class="text-white">Apellidos</label>
                        <input type="text" class="form-control" id="lastName" name="lastName" value="{{user.lastName}}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="text-white">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{user.email}}" required>
                </div>

                <div class="form-group">
                    <label for="password" class="text-white">Nueva Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Déjalo en blanco si no quieres cambiarla">
                </div>

                <div class="form-group mt-4">
                    <label for="profilePicture" class="text-white">Cambiar Foto de Perfil</label>
                    <input type="file" class="form-control-file text-white" id="profilePicture" name="profilePicture" accept="image/*">
                </div>

                <div class="d-flex mt-4">
                    <button type="submit" class="btn btn-success mr-3">
                        <i class="fas fa-save mr-2"></i> Guardar Cambios
                    </button>
                    <a href="/profile" class="btn btn-secondary">
                        <i class="fas fa-times mr-2"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
