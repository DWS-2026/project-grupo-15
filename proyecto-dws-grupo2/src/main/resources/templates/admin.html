<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Admin Panel | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

        {{> partials/sidebar-admin}}

        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <div class="d-flex justify-content-end mb-5 mt-2">
                <span class="text-white-50">Bienvenido, Admin</span>
            </div>

            <div class="row mb-5">
                <div class="col-md-3 mb-4">
                    <div class="card bg-primary text-white text-center p-4 h-100 border-0">
                        <i class="fas fa-users fa-2x mb-3"></i>
                        <h3 class="mb-1">{{totalMembers}}</h3>
                        <p class="mb-0 text-white-50">Miembros</p>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card bg-secondary text-white text-center p-4 h-100 border-0">
                        <i class="fas fa-dumbbell fa-2x mb-3"></i>
                        <h3 class="mb-1">{{totalClasses}}</h3>
                        <p class="mb-0 text-white-50">Clases</p>
                    </div>
                </div>
               
            </div>

            <div class="card bg-secondary p-4 border-0">
                <h4 class="mb-4 text-primary">Últimos Miembros</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover border-0">
                        <thead>
                            <tr class="text-white-50">
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Estatus</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{#recentMembers}}
                            <tr>
                                <td>{{nombre}}</td>
                                <td>{{email}}</td>
                                <td class="{{statusColor}}">{{statusText}}</td>
                            </tr>
                            {{/recentMembers}}
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
