<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Detalle de Clase | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container-fluid">
        <div class="row">

            <nav class="col-md-3 col-lg-2 d-md-block bg-secondary sidebar py-5" style="min-height: 100vh;">
                <div class="text-center mb-5">
                    <h2 class="text-primary font-weight-bold">TITANGYM</h2>
                    <p class="text-white-50">Área de Usuario</p>
                </div>

                <ul class="nav flex-column px-3">
                    <li class="nav-item mb-3"><a class="nav-link text-white" href="/"><i class="fas fa-home mr-2"></i> Inicio</a></li>
                    <li class="nav-item mb-3"><a class="nav-link text-white" href="/profile"><i class="fas fa-user mr-2"></i> Mi Perfil</a></li>
                    <li class="nav-item mb-3"><a class="nav-link text-white" href="/servicios"><i class="fas fa-plus-circle mr-2"></i> Servicios</a></li>
                    <li class="nav-item mb-3"><a class="nav-link text-white active" href="/classes"><i class="fas fa-dumbbell mr-2"></i> Clases</a></li>
                    <li class="nav-item mb-3"><a class="nav-link text-white" href="/reviews"><i class="fas fa-star mr-2"></i> Reviews</a></li>
                    <li class="nav-item mt-5"><a class="nav-link text-danger" href="/logout"><i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión</a></li>
                </ul>
            </nav>

            <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

                {{#clase}}
                <div class="card bg-secondary p-5" style="border-radius: 15px;">
                    <div class="row">
                        <div class="col-md-5 mb-4 mb-md-0">
                            <img src="/img/crossfit.jpg" alt="Imagen de la clase" class="img-fluid rounded shadow-lg" style="width: 100%; object-fit: cover;">
                        </div>
                        
                        <div class="col-md-7 d-flex flex-column justify-content-center">
                            <h2 class="display-4 text-primary font-weight-bold mb-3">{{name}}</h2>
                            <p class="lead text-white-50 mb-4">{{description}}</p>
                            
                            <div class="mt-auto">
                                <a href="#" class="btn btn-primary btn-lg mr-3"><i class="fas fa-check-circle mr-2"></i> Apuntarme</a>
                                <a href="/classes" class="btn btn-outline-light btn-lg"><i class="fas fa-arrow-left mr-2"></i> Volver</a>
                            </div>
                        </div>
                    </div>
                </div>
                {{/clase}}
                
                {{^clase}}
                <div class="alert alert-danger mt-4">
                    <h3>Error</h3>
                    <p>No se ha encontrado la información de esta clase.</p>
                    <a href="/classes" class="btn btn-outline-light">Volver a la lista</a>
                </div>
                {{/clase}}

            </main>
        </div>
    </div>

</body>
</html>
