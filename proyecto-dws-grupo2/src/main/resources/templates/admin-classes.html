<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Clases | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

        {{> partials/sidebar-admin}}

        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Clases</h1>
                <a href="admin-clase-crear.html" class="btn btn-primary">
                    <i class="fas fa-plus mr-2"></i> Añadir clase
                </a>
            </div>

            <div class="card bg-secondary p-4">
                <h4 class="mb-4 text-primary">Clases disponibles</h4>

                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Título</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <!-- CROSSFIT -->
                             {{#clases}}
                            <tr>
                                <td><img src="img/crossfit.jpg" width="80" class="rounded"></td>
                                <td>{{name}}</td>
                                <td>{{description}}</td>
                                <td>
                                    <a href="/admin/clases/{{id}}/asistentes" class="btn btn-info btn-sm mr-2" title="Ver Asistentes">
                                        <i class="fas fa-users"></i>
                                        </a>
                                    <a href="admin/clase/editar/{{id}}" class="btn btn-light btn-sm mr-2">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a href="#" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar {{name}}?')">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </td>
                            </tr>
                            {{/clases}}
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
