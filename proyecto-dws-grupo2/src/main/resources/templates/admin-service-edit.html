<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Editar Servicio | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">
        {{> partials/sidebar-admin}}

        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Editar Servicio</h1>
                <a href="/admin/services" class="btn btn-light">
                    <i class="fas fa-arrow-left mr-2"></i> Volver
                </a>
            </div>

            <div class="card bg-secondary text-white p-5">

                <h3 class="mb-4 text-primary">Modificar datos</h3>

                <form action="/admin/services/edit/{{service.id}}" method="POST" enctype="multipart/form-data">

                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Título</label>
                        <input type="text" name="name" class="form-control bg-dark text-white border-0" value="{{service.name}}" required>
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Descripción</label>
                        <textarea name="description" class="form-control bg-dark text-white border-0" rows="4" required>{{service.description}}</textarea>
                    </div>

                    <div class="form-group mb-4">
                        <label class="font-weight-bold">Imagen actual</label><br>
                        <img src="{{service.imageUrl}}" onerror="this.src='/img/avatar.jpg'" width="150" class="rounded mb-3">
                        <input type="file" name="imageFile" class="form-control bg-dark text-white border-0" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary mr-3">
                        <i class="fas fa-save mr-2"></i> Guardar cambios
                    </button>

                    <a href="/admin/services" class="btn btn-light">
                        <i class="fas fa-times mr-2"></i> Cancelar
                    </a>

                </form>
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
