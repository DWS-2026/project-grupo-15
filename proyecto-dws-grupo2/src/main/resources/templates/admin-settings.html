<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ajustes | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

       {{> partials/sidebar-admin}}
        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <h1 class="display-4 font-weight-bold mb-5">Ajustes del Sistema</h1>

            <!-- AJUSTES DEL ADMINISTRADOR -->
            <div class="card bg-secondary text-white p-4 mb-5">
                <h3 class="text-primary mb-4"><i class="fas fa-user-cog mr-2"></i> Ajustes del Administrador</h3>

                <form>
                    <div class="form-group mb-3">
                        <label>Nombre del administrador</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="Administrador TITANGYM">
                    </div>

                    <div class="form-group mb-3">
                        <label>Correo electrónico</label>
                        <input type="email" class="form-control bg-dark text-white border-0" value="admin@titangym.com">
                    </div>

                    <div class="form-group mb-3">
                        <label>Nueva contraseña</label>
                        <input type="password" class="form-control bg-dark text-white border-0" placeholder="Dejar en blanco para no cambiar">
                    </div>

                    <button class="btn btn-primary mt-2">
                        <i class="fas fa-save mr-2"></i> Guardar cambios
                    </button>
                </form>
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
            </div>

            <!-- AJUSTES DEL GIMNASIO -->
            <div class="card bg-secondary text-white p-4 mb-5">
                <h3 class="text-primary mb-4"><i class="fas fa-building mr-2"></i> Información del Gimnasio</h3>

                <form>
                    <div class="form-group mb-3">
                        <label>Nombre del gimnasio</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="TITANGYM">
                    </div>

                    <div class="form-group mb-3">
                        <label>Dirección</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="Calle Ejemplo 123, Madrid">
                    </div>

                    <div class="form-group mb-3">
                        <label>Teléfono</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="+34 600 123 456">
                    </div>

                    <div class="form-group mb-3">
                        <label>Horario</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="Lunes - Domingo: 06:00 - 23:00">
                    </div>

                    <button class="btn btn-primary mt-2">
                        <i class="fas fa-save mr-2"></i> Guardar cambios
                    </button>
                </form>
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
            </div>

            <!-- AJUSTES VISUALES -->
            <div class="card bg-secondary text-white p-4 mb-5">
                <h3 class="text-primary mb-4"><i class="fas fa-paint-brush mr-2"></i> Apariencia del Panel</h3>

                <form>
                    <div class="form-group mb-3">
                        <label>Color principal</label>
                        <select class="form-control bg-dark text-white border-0">
                            <option selected>Rojo TITANGYM</option>
                            <option>Azul</option>
                            <option>Verde</option>
                            <option>Amarillo</option>
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label>Logo del gimnasio</label>
                        <input type="file" class="form-control bg-dark text-white border-0">
                    </div>

                    <button class="btn btn-primary mt-2">
                        <i class="fas fa-save mr-2"></i> Guardar cambios
                    </button>
                </form>
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
            </div>

            <!-- AJUSTES DE SEGURIDAD -->
            <div class="card bg-secondary text-white p-4 mb-5">
                <h3 class="text-primary mb-4"><i class="fas fa-shield-alt mr-2"></i> Seguridad</h3>

                <form>
                    <div class="form-group mb-3">
                        <label>Verificación en dos pasos</label>
                        <select class="form-control bg-dark text-white border-0">
                            <option>Desactivada</option>
                            <option>Activada</option>
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label>Forzar cambio de contraseña cada 90 días</label>
                        <select class="form-control bg-dark text-white border-0">
                            <option>No</option>
                            <option>Sí</option>
                        </select>
                    </div>

                    <button class="btn btn-primary mt-2">
                        <i class="fas fa-save mr-2"></i> Guardar cambios
                    </button>
                </form>
                <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
