<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Clases | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container-fluid">
        <div class="row">

            <nav class="col-md-3 col-lg-2 d-md-block bg-secondary sidebar py-5">
                <div class="text-center mb-5">
                    <h2 class="text-primary font-weight-bold">TITANGYM</h2>
                    <p class="text-white-50">Área de Usuario</p>
                </div>

                <ul class="nav flex-column px-3">
                    <li class="nav-item mb-3">
                        <a class="nav-link text-white" href="/">
                            <i class="fas fa-home mr-2"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item mb-3">
                        <a class="nav-link text-white" href="/profile">
                            <i class="fas fa-user mr-2"></i> Mi Perfil
                        </a>
                    </li>
                    <li class="nav-item mb-3">
                        <a class="nav-link text-white" href="/servicios">
                            <i class="fas fa-plus-circle mr-2"></i> Servicios
                        </a>
                    </li>
                    <li class="nav-item mb-3">
                        <a class="nav-link text-white active" href="/classes">
                            <i class="fas fa-dumbbell mr-2"></i> Clases
                        </a>
                    </li>
                    <li class="nav-item mb-3">
                        <a class="nav-link text-white" href="/reviews">
                            <i class="fas fa-star mr-2"></i> Reviews
                        </a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="/logout">
                            <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

                <div class="card bg-secondary p-4">
                    <h4 class="mb-4 text-primary">Clases disponibles</h4>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Título</th>
                                    <th>Descripción</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                {{#clases}}
                                <tr>
                                    <td><img src="img/crossfit.jpg" width="80" class="rounded"></td>
                                    
                                    <td>{{name}}</td>
                                    <td>{{description}}</td>
                                    
                                    <td>
                                        <a href="/classes/{{id}}" class="btn btn-outline-light btn-block btn-subscribe">
                                            Ver detalles
                                        </a>
                                    </td>
                                </tr>
                                {{/clases}}
                                
                                {{^clases}}
                                <tr>
                                    <td colspan="4" class="text-center">No hay clases registradas en el gimnasio.</td>
                                </tr>
                                {{/clases}}
                            </tbody>
                        </table>
                    </div>
                </div>

                </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>

</html>
