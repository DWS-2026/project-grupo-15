<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Usuarios | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

       {{> partials/sidebar-admin}}

        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Usuarios</h1>
                <a href="/admin/members/new" class="btn btn-primary">
                    <i class="fas fa-user-plus mr-2"></i> Añadir usuario
                </a>
            </div>

            <div class="card bg-secondary p-4">
                <h4 class="mb-4 text-primary">Usuarios registrados</h4>

                <div class="table-responsive">
                    <table class="table table-dark table-hover text-center align-middle">
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            {{#members}}
                            <tr>
                                <td>
                                    <img src="{{photo}}" onerror="this.src='/img/avatar.jpg'" width="45" height="45" class="rounded-circle">
                                </td>
                                <td>{{nombre}}</td>
                                <td>{{email}}</td>
                                <td class="{{statusColor}}">{{estado}}</td>
                                <td>
                                    <a href="/admin/members/{{id}}" class="btn btn-primary btn-sm mr-2">
                                        <i class="fas fa-eye"></i>
                                    </a>

                                    <a href="/admin/members/edit/{{id}}" class="btn btn-light btn-sm mr-2">
                                        <i class="fas fa-edit"></i>
                                    </a>

                                    <form action="/admin/members/delete/{{id}}" method="POST" style="display:inline;">
                                        <input type="hidden" name="_csrf" value="{{token}}"/>
                                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            {{/members}}
                            </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
