<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Mi Perfil | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="/img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div class="container-fluid">
        <div class="row">
            {{> partials/sidebar}}
            
            <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h1 class="display-4 font-weight-bold">Mi Perfil</h1>
                    <span class="text-white-50">Bienvenido, {{user.firstName}}</span>
                </div>

                <div class="card bg-secondary text-white p-5 text-center">
                    <img src="{{user.profileImageUrl}}" 
                         class="rounded-circle mb-3 border border-primary" 
                         width="150" height="150" 
                         style="object-fit: cover;" 
                         onerror="this.src='/img/avatar.jpg'" 
                         alt="Foto de perfil">

                    <h2 class="font-weight-bold">{{user.firstName}} {{user.lastName}}</h2>
                    <p class="text-white-50">{{user.email}}</p>

                    <hr class="border-light my-4">

                    <div class="text-left">
                        <h3 class="mb-4 text-primary">Información Personal</h3>
                        <p><strong>Nombre:</strong> {{user.firstName}}</p>
                        <p><strong>Apellidos:</strong> {{user.lastName}}</p>
                        <p><strong>Plan actual:</strong> Titan</p>
                        <p><strong>Estado:</strong> <span class="badge badge-success">Activo</span></p>
                    </div>

                    <div class="d-flex mt-4">
                        <a href="/profile/edit" class="btn btn-primary">
                            <i class="fas fa-edit mr-2"></i> Editar Perfil
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
