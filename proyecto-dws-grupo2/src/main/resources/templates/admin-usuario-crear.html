<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Añadir Usuario | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Favicon -->
    <link href="/img/favicon.ico" rel="icon">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap + Template CSS -->
    <link href="/css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

        {{> partials/sidebar-admin}}
        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <!-- CABECERA -->
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Añadir Usuario</h1>
                <a href="admin-usuarios.html" class="btn btn-light">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al listado
                </a>
            </div>

            <!-- FORMULARIO -->
            <div class="card bg-secondary text-white p-5">

                <h3 class="mb-4 text-primary">Datos del nuevo usuario</h3>

                <form>

                    <!-- FOTO -->
                    <div class="form-group mb-4">
                        <label class="font-weight-bold">Foto de perfil</label>
                        <input type="file" class="form-control bg-dark text-white border-0">
                    </div>

                    <!-- NOMBRE -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Nombre</label>
                        <input type="text" class="form-control bg-dark text-white border-0" placeholder="Nombre del usuario">
                    </div>

                    <!-- APELLIDOS -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Apellidos</label>
                        <input type="text" class="form-control bg-dark text-white border-0" placeholder="Apellidos del usuario">
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Correo electrónico</label>
                        <input type="email" class="form-control bg-dark text-white border-0" placeholder="email@ejemplo.com">
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Contraseña</label>
                        <input type="password" class="form-control bg-dark text-white border-0" placeholder="Contraseña">
                    </div>

                    <!-- PLAN -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Plan</label>
                        <select class="form-control bg-dark text-white border-0">
                            <option>Premium</option>
                            <option>Básico</option>
                            <option>VIP</option>
                        </select>
                    </div>

                    <!-- ESTADO -->
                    <div class="form-group mb-4">
                        <label class="font-weight-bold">Estado</label>
                        <select class="form-control bg-dark text-white border-0">
                            <option>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>

                    <!-- BOTONES -->
                    <button type="submit" class="btn btn-primary mr-3">
                        <i class="fas fa-save mr-2"></i> Guardar usuario
                    </button>

                    <a href="admin-usuarios.html" class="btn btn-light">
                        <i class="fas fa-times mr-2"></i> Cancelar
                    </a>

                </form>

            </div>

        </main>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
