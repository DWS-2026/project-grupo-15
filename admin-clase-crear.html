<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Añadir Clase | Panel Admin TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-secondary sidebar py-5">
            <div class="text-center mb-5">
                <h2 class="text-primary font-weight-bold">TITANGYM</h2>
                <p class="text-white-50">Panel de Administración</p>
            </div>

            <ul class="nav flex-column px-3">
                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="admin-dashboard.html">
                        <i class="fas fa-tachometer-alt mr-2"></i> Panel Principal
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="admin-usuarios.html">
                        <i class="fas fa-users mr-2"></i> Usuarios
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white active" href="admin-clases.html">
                        <i class="fas fa-dumbbell mr-2"></i> Clases
                    </a>
                </li>
                
                <li class="nav-item mb-3">
                    <a class="nav-link text-white active" href="admin-servicios.html">
                        <i class="fas fa-plus-circle mr-2"></i> Servicios Extra
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="admin-ajustes.html">
                        <i class="fas fa-cog mr-2"></i> Ajustes
                    </a>
                </li>

                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" href="index.html">
                        <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
                    </a>
                </li>
            </ul>
        </nav>

        <!-- CONTENIDO -->
        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Añadir Clase</h1>
                <a href="admin-clases.html" class="btn btn-light">
                    <i class="fas fa-arrow-left mr-2"></i> Volver
                </a>
            </div>

            <div class="card bg-secondary text-white p-5">

                <h3 class="mb-4 text-primary">Datos de la clase</h3>

                <form>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Título</label>
                        <input type="text" class="form-control bg-dark text-white border-0" placeholder="Ej: CrossFit">
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold">Descripción</label>
                        <textarea class="form-control bg-dark text-white border-0" rows="4" placeholder="Descripción de la clase"></textarea>
                    </div>

                    <div class="form-group mb-4">
                        <label class="font-weight-bold">Imagen</label>
                        <input type="file" class="form-control bg-dark text-white border-0">
                    </div>

                    <button type="submit" class="btn btn-primary mr-3">
                        <i class="fas fa-save mr-2"></i> Guardar clase
                    </button>

                    <a href="admin-clases.html" class="btn btn-light">
                        <i class="fas fa-times mr-2"></i> Cancelar
                    </a>

                </form>

            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
