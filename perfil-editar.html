<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Editar Perfil | TITANGYM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap + Template CSS -->
    <link href="css/style.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container-fluid">
    <div class="row">

         <!-- SIDEBAR -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-secondary sidebar py-5">
            <div class="text-center mb-5">
                <h2 class="text-primary font-weight-bold">TITANGYM</h2>
                <p class="text-white-50">Área de Usuario</p>
            </div>

            <ul class="nav flex-column px-3">
                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="index.html">
                        <i class="fas fa-home mr-2"></i> Inicio
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="perfil.html">
                        <i class="fas fa-user mr-2"></i> Mi Perfil
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="servicios-listado.html">
                        <i class="fas fa-plus-circle mr-2"></i> Servicios
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white" href="clases-listado.html">
                        <i class="fas fa-dumbbell mr-2"></i> Clases
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link text-white active" href="reviews.html">
                        <i class="fas fa-star mr-2"></i> Reviews
                    </a>
                </li>

                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" href="login.html">
                        <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
                    </a>
                </li>
            </ul>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 ml-sm-auto px-4 py-5">

            <!-- CABECERA -->
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="display-4 font-weight-bold">Editar Perfil</h1>
                <span class="text-white-50">Modifica tus datos personales</span>
            </div>

            <!-- FORMULARIO DE EDICIÓN -->
            <div class="card bg-secondary text-white p-5">

                <h3 class="mb-4 text-primary">Información Personal</h3>

                <form>

                    <!-- FOTO -->
                    <div class="text-center mb-4">
                        <img src="img/avatar-ejemplo.jpg" class="rounded-circle mb-3" width="150" height="150" alt="Foto de perfil">
                        <div class="mt-3">
                            <label class="form-label">Cambiar foto</label>
                            <input type="file" class="form-control bg-dark text-white border-0">
                        </div>
                    </div>

                    <!-- CAMPOS -->
                    <div class="form-group mb-3">
                        <label>Nombre</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="Manuel">
                    </div>

                    <div class="form-group mb-3">
                        <label>Apellidos</label>
                        <input type="text" class="form-control bg-dark text-white border-0" value="García López">
                    </div>

                    <div class="form-group mb-3">
                        <label>Correo electrónico</label>
                        <input type="email" class="form-control bg-dark text-white border-0" value="usuario@correo.com">
                    </div>

                    <div class="form-group mb-3">
                        <label>Nueva contraseña</label>
                        <input type="password" class="form-control bg-dark text-white border-0" placeholder="Dejar en blanco para no cambiar">
                    </div>

                    <!-- BOTONES -->
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary mr-3">
                            <i class="fas fa-save mr-2"></i> Guardar cambios
                        </button>

                        <a href="perfil.html" class="btn btn-light">
                            <i class="fas fa-arrow-left mr-2"></i> Volver al perfil
                        </a>
                    </div>

                </form>

            </div>

        </main>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>
</html>
