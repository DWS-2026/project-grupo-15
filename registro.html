<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TitanGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <link href="css/style.min.css" rel="stylesheet">

    <link href="img/favicon.ico" rel="icon">


</head>
<body class = "bg-dark">

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card bg-secondary text-white p-4" style="max-width: 550px; width: 100%; border-radius: 15px;">
        <div class="text-center mb-4">
            <h1 class="display-4 font-weight-bold text-primary">TITANGYM</h1>
            <p class="text-white-50">Introduce tus datos</p>
        </div>

        <form>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre" class="form-control form-control-lg bg-dark text-white border-0"
                        placeholder="Introduce tu nombre" required>
            </div>

            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" id="apellidos" class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Introduce tus apellidos" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Introduce tu email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" class="form-control form-control-lg bg-dark text-white border-0"
                       placeholder="Introduce tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">
                Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-white-50">¿No recuerdas tu contraseña?</a><br>
            <a href="#" class="text-primary font-weight-bold">Registrarse</a>
        </div>
    </div>
</div>
<!-- Login End -->

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>


</body>
</html>
